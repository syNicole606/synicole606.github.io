<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrarse</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f2f5fd;
      font-family: 'Segoe UI', sans-serif;
    }

    .card {
      background: #f8f9ff;
      border: 1px solid #c0cef4;
      border-radius: 20px;
      padding: 2.5rem 2rem 2rem;
      width: 360px;
      position: relative;
      box-shadow: 0 4px 24px rgba(83, 112, 212, 0.08);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      color: #537ED4;
      font-size: 13px;
      padding: 0;
      margin-bottom: 1.2rem;
      text-decoration: none;
    }
    .btn-back:hover { color: #2243A3; }
    .btn-back::before { content: "←"; }

    .title {
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      color: #243E93;
      margin-bottom: 1.8rem;
    }

    .form-input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #c0cef4;
      border-radius: 10px;
      background: #fff;
      font-size: 14px;
      color: #243E93;
      margin-bottom: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: #537ED4;
      box-shadow: 0 0 0 3px rgba(83,126,212,0.12);
    }
    .form-input::placeholder { color: #93AEE8; }

    .btn-primary {
      display: block;
      width: 100%;
      padding: 12px;
      background: #c0cef4;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      color: #243E93;
      cursor: pointer;
      margin-top: 0.5rem;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #93AEE8; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ---------- Ventana de verificación ---------- */
    .modal-fondo {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(36, 62, 147, 0.35);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 9999;
    }
    .modal-fondo.activo { display: flex; }

    .modal {
      background: #fff;
      border: 1px solid #c0cef4;
      border-radius: 20px;
      padding: 2rem 1.6rem 1.6rem;
      max-width: 340px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(83, 112, 212, 0.2);
    }
    .modal-icono { font-size: 44px; margin-bottom: 0.6rem; }
    .modal h3 { color: #243E93; font-size: 20px; margin-bottom: 0.6rem; }
    .modal p { color: #3f55a3; font-size: 14px; line-height: 1.5; margin-bottom: 1.2rem; }
    .modal .btn-primary { margin-top: 0.4rem; }
    .btn-secundario {
      background: none;
      border: 1px solid #c0cef4;
      color: #537ED4;
    }
    .btn-secundario:hover { background: #f2f5fd; }
    #avisoReenvio { font-size: 13px; color: #537ED4; margin-top: 0.6rem; min-height: 1em; }
  </style>
</head>
<body>

<div class="card">
  <a href="iniciarsesion.html" class="btn-back">Volver</a>

  <p class="title">🐾 Registrarse</p>

  <input class="form-input" type="text" id="nombre" placeholder="Nombre completo" />
  <input class="form-input" type="text" id="cedula" placeholder="Cédula" />
  <input class="form-input" type="email" id="correo" placeholder="Correo" />
  <input class="form-input" type="password" id="contrasena" placeholder="Contraseña" />
  <input class="form-input" type="tel" id="telefono" placeholder="Teléfono" />

  <p id="mensaje" style="color:#D4537E; font-size:13px; margin-bottom:10px;"></p>

  <button class="btn-primary" id="btnConfirmar" onclick="registrarUsuario()">Confirmar</button>
</div>

<!-- Ventana que confirma el envío del correo de verificación -->
<div class="modal-fondo" id="modalVerificacion">
  <div class="modal">
    <div class="modal-icono" id="modalIcono">📩</div>
    <h3 id="modalTitulo">¡Revisa tu correo!</h3>
    <p id="modalTexto"></p>
    <button class="btn-primary btn-secundario" id="btnReenviar" style="display:none" onclick="reenviarVerificacion()">
      Reenviar correo
    </button>
    <p id="avisoReenvio"></p>
    <button class="btn-primary" onclick="irAlLogin()">Entendido</button>
  </div>
</div>

<script>
const API = 'https://huellas-a-casa-backend.onrender.com';
let correoRegistrado = '';

function mostrarModal(enviado, texto) {
  document.getElementById('modalIcono').textContent = enviado ? '📩' : '⚠️';
  document.getElementById('modalTitulo').textContent = enviado ? '¡Revisa tu correo!' : 'Cuenta creada';
  document.getElementById('modalTexto').textContent = texto;
  document.getElementById('btnReenviar').style.display = enviado ? 'none' : 'block';
  document.getElementById('avisoReenvio').textContent = '';
  document.getElementById('modalVerificacion').classList.add('activo');
}

function irAlLogin() {
  window.location.href = 'iniciarsesion.html';
}

async function registrarUsuario() {
  const nombre = document.getElementById('nombre').value.trim();
  const cedula = document.getElementById('cedula').value.trim();
  const correo = document.getElementById('correo').value.trim();
  const contrasena = document.getElementById('contrasena').value;
  const telefono = document.getElementById('telefono').value.trim();
  const mensaje = document.getElementById('mensaje');
  const boton = document.getElementById('btnConfirmar');

  mensaje.textContent = '';

  if (!nombre || !correo || !contrasena) {
    mensaje.textContent = "Por favor completa nombre, correo y contraseña.";
    return;
  }

  boton.disabled = true;
  boton.textContent = 'Enviando...';

  try {
    const respuesta = await fetch(API + '/api/registrar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre, cedula, correo, contrasena, telefono })
    });

    const data = await respuesta.json();

    if (data.exito && data.requiere_verificacion) {
      correoRegistrado = correo;
      mostrarModal(data.correo_enviado === true, data.mensaje);
    } else {
      mensaje.textContent = data.mensaje || 'No se pudo completar el registro.';
    }
  } catch (error) {
    mensaje.textContent = "Error de conexión con el servidor. Si es la primera vez, espera unos segundos e inténtalo de nuevo.";
    console.error(error);
  } finally {
    boton.disabled = false;
    boton.textContent = 'Confirmar';
  }
}

async function reenviarVerificacion() {
  const aviso = document.getElementById('avisoReenvio');
  aviso.textContent = 'Enviando...';
  try {
    const respuesta = await fetch(API + '/api/reenviar_verificacion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ correo: correoRegistrado })
    });
    const data = await respuesta.json();
    aviso.textContent = data.mensaje;
  } catch (e) {
    aviso.textContent = 'No se pudo conectar con el servidor.';
  }
}
</script>

</body>
</html>
